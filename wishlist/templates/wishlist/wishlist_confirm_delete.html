{% extends 'wishlist/base.html' %}
{% block content %}
<div class="col-12">
    <div class="card">
        <div class="card-body">
            <h5 class="card-title">Вы уверены, что хотите удалить "{{ object.title }}"?</h5>
            <form method="post">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger">Да, удалить</button>
                <a href="{% url 'wishlist:personal_page_wishlist' user_id=request.user.id %}" class="text-white">Моя
                    страница</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
